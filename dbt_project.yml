name: rentlens
version: '1.0.0'
config-version: 2

profile: rentlens

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
macro-paths: ["macros"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

models:
  rentlens:
    staging:
      +materialized: view
    intermediate:
      +materialized: view
    marts:
      +materialized: table
vars:
  raw_lodgements_path: "{{ env_var('RENTLENS_DATA_PATH') }}"
