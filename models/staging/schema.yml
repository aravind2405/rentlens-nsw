version: 2

models:
  - name: stg_bond_lodgements
    description: >
      One row per NSW rental bond lodgement. Sourced from NSW Fair Trading
      monthly Excel files, Sep 2025 - Aug 2026. All columns cast to their
      correct types; no rows filtered.

    columns:
      - name: lodgement_date
        description: Date the bond was lodged with NSW Fair Trading
        tests:
          - not_null

      - name: postcode
        description: NSW postcode of the rental property
        tests:
          - not_null

      - name: dwelling_type
        description: Type of dwelling (F=Flat, H=House, etc.)
        tests:
          - not_null

      - name: bedrooms
        description: Number of bedrooms. NULL where source value was non-numeric (e.g. U for unknown).

      - name: weekly_rent
        description: Weekly rent in AUD. NULL where source value was non-numeric.

      - name: file_month
        description: Month the source file covers (YYYY-MM)
        tests:
          - not_null
