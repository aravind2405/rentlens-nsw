name: dbt build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-dbt-duckdb-pandas-requests

      - name: Install dependencies
        run: pip install dbt-duckdb pandas requests

      - name: Download raw data
        run: |
          if ls data/raw/lodgements/*.parquet 1>/dev/null 2>&1; then
            echo "Parquet files already present, skipping download."
          else
            python ingest/load_lodgements.py
          fi
          ls data/raw/lodgements/

      - name: Run dbt build
        run: dbt build --profiles-dir .
        env:
          RENTLENS_DATA_PATH: ${{ github.workspace }}/data/raw/lodgements
