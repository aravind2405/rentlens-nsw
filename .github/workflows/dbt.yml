name: dbt build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    # Pinned: the ubuntu-latest label is moving to Ubuntu 26. Move up on purpose once CI passes there.
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Cache pip packages
        uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Download raw data
        run: |
          if ls data/raw/lodgements/*.parquet 1>/dev/null 2>&1; then
            echo "Parquet files already present, skipping download."
          else
            python ingest/load_lodgements.py
          fi
          ls data/raw/lodgements/

      - name: Run dbt build
        run: dbt build --profiles-dir .
        env:
          RENTLENS_DATA_PATH: ${{ github.workspace }}/data/raw/lodgements
