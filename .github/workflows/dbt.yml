name: dbt build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install dbt-duckdb pandas requests

      - name: Download raw data
        run: python ingest/load_lodgements.py

      - name: Run dbt build
        run: dbt build
        env:
          RENTLENS_DATA_PATH: ${{ github.workspace }}/data/raw/lodgements
